<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideias de logo, rodada 2 | Sítio Shalom Xerém</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#1B4332;--noite:#0F291E;--creme:#FAF8F5;--areia:#E5E0D8;--ambar:#D97706;--pedra:#57534E;--tinta:#1C1917}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--creme);color:var(--tinta);line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:48px 20px 80px}
h1{font:700 clamp(30px,5vw,46px)/1.1 'Playfair Display',serif;color:var(--verde)}
.intro{max-width:64ch;color:var(--pedra);margin:12px 0 40px}
.conceito{border-top:1px solid var(--areia);padding:36px 0}
.topo{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.topo b{font:600 13px 'Plus Jakarta Sans';color:#B45309}
h2{font:700 26px 'Playfair Display',serif;color:var(--verde)}
.conceito>p{max-width:70ch;color:var(--pedra);font-size:15px}
.linha{display:grid;gap:14px;grid-template-columns:1.5fr 1.5fr .8fr;margin-top:18px}
.palco{border-radius:12px;border:1px solid var(--areia);display:flex;align-items:center;justify-content:center;min-height:190px;padding:22px}
.palco.l{background:var(--creme)}.palco.d{background:var(--noite);border-color:var(--noite)}.palco.i{background:#fff;flex-direction:column;gap:14px}
.palco.i .app{width:64px;height:64px;border-radius:15px;background:var(--verde);display:flex;align-items:center;justify-content:center}
.palco.i .peq{display:flex;gap:14px;align-items:center}
.lock{display:flex;align-items:center;gap:16px}
.lock .n{font:700 32px/1 'Playfair Display',serif}.lock .s{display:block;font:600 10px 'Plus Jakarta Sans';letter-spacing:.2em;text-transform:uppercase;margin-top:7px}
.lock.l .n{color:var(--verde)}.lock.l .s{color:var(--pedra)}.lock.d .n{color:#fff}.lock.d .s{color:#d6d3cd}
@media(max-width:820px){.linha{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ideias de logo, rodada 2</h1>
  <p class="intro">Desta vez mais ousadas e menos “ícone genérico”: uma ilustração do próprio sítio, a pomba da paz, a letra hebraica de Shalom, um brasão e outras. Mesma apresentação: fundo claro, fundo escuro e tamanho de ícone.</p>
  <div id="lista"></div>
</div>
<script>
const L={fg:'#1B4332',bg:'#FAF8F5',ac:'#D97706'}, D={fg:'#FAF8F5',bg:'#0F291E',ac:'#D97706'};

// Folha em forma de lente, apontando para cima, com a base em (0,0)
const folha=(c,esc=1,cor)=>`<path d="M0 0C7-9 7-21 0-30C-7-21-7-9 0 0Z" transform="scale(${esc})" fill="${cor||c.fg}"/>`;
const raios=(c,cx,cy,r1,r2,n)=>Array.from({length:n},(_,i)=>{const a=Math.PI*(1+(i+.5)/n);return `<line x1="${(cx+r1*Math.cos(a)).toFixed(1)}" y1="${(cy+r1*Math.sin(a)).toFixed(1)}" x2="${(cx+r2*Math.cos(a)).toFixed(1)}" y2="${(cy+r2*Math.sin(a)).toFixed(1)}" stroke="${c.ac}" stroke-width="2.2" stroke-linecap="round"/>`}).join('');

const SIMBOLOS={
 cena:c=>`<defs><clipPath id="arc${c.fg.slice(1)}"><path d="M6 62V30a26 26 0 0 1 52 0V62Z"/></clipPath></defs>
   <g clip-path="url(#arc${c.fg.slice(1)})"><rect width="64" height="64" fill="#1B4332"/><circle cx="41" cy="25" r="7" fill="${c.ac}"/>
   <path d="M6 47 19 32l9 9 12-12 18 20v13H6Z" fill="#2D6A4F"/><path d="M6 53C18 45 30 51 42 47c8-3 12-1 16 1v14H6Z" fill="#40916C"/>
   <circle cx="17" cy="45" r="4.6" fill="#14301F"/><rect x="16.4" y="47" width="1.3" height="5" fill="#14301F"/>
   <path d="M6 58c14-4 28 2 52-3v7H6Z" fill="#FAF8F5"/></g>
   <path d="M6 62V30a26 26 0 0 1 52 0V62Z" fill="none" stroke="${c.fg}" stroke-width="2"/>`,
 pomba:c=>`<circle cx="32" cy="32" r="30" fill="${c.fg}"/>
   <g fill="${c.bg}" stroke="${c.fg}" stroke-width="1.3" stroke-linejoin="round">
   <path d="M34 32C31 24 35 15 43 11c1 6 0 12-2 17Z"/><path d="M30 33C24 24 26 13 33 7c2 8 4 15 5 21Z"/><path d="M27 34C19 28 17 18 21 10c5 6 8 14 11 21Z"/></g>
   <path d="M41.5 29C39 38 27 42 9 41c7-2 11-5 15-8 6 2 12 0 17.500-4Z" fill="${c.bg}"/><path d="M9 41l-3 5 7-3Z" fill="${c.bg}"/>
   <circle cx="44.500" cy="27" r="4.500" fill="${c.bg}"/><path d="M48.500 26l6.500 1.500-6.500 2.100Z" fill="${c.ac}"/><circle cx="45.500" cy="26" r="1" fill="${c.fg}"/>
   <path d="M20 53c9 2 19-1 26-8" stroke="${c.ac}" stroke-width="2" fill="none" stroke-linecap="round"/>
   <g fill="${c.ac}"><ellipse cx="27" cy="54" rx="4.2" ry="1.9" transform="rotate(-20 27 54)"/><ellipse cx="34" cy="53.5" rx="4.2" ry="1.9" transform="rotate(-35 34 53.5)"/><ellipse cx="41" cy="50.6" rx="4.2" ry="1.9" transform="rotate(-50 41 50.6)"/></g>`,
 folhas:c=>`<g transform="translate(32 32)">
   <g transform="translate(0 -4)">${folha(c,1.05)}</g>
   <g transform="rotate(180) translate(0 -4)">${folha(c,1.05)}</g>
   <g transform="rotate(90) translate(0 -4)">${folha(c,.78)}</g>
   <g transform="rotate(-90) translate(0 -4)">${folha(c,.78)}</g>
   <circle r="4.6" fill="${c.ac}"/></g>`,
 trilha:c=>`<rect x="2" y="2" width="60" height="60" rx="16" fill="${c.fg}"/>
   <path d="M44 20C31 10 17 19 24 28c7 9 24 7 19 19-3 7-17 8-24-1" fill="none" stroke="${c.bg}" stroke-width="7.5" stroke-linecap="round"/>
   <circle cx="47" cy="15" r="5.5" fill="${c.ac}"/>`,
 brasao:c=>`<path d="M8 6h48v28c0 14-12 22-24 28C20 56 8 48 8 34Z" fill="${c.fg}"/>
   <path d="M12 10h40v24c0 11-9 18-20 23-11-5-20-12-20-23Z" fill="none" stroke="${c.bg}" stroke-width="1.3"/>
   <rect x="29.4" y="13" width="5.2" height="27" rx="1" fill="${c.bg}"/><rect x="22" y="19" width="20" height="5.2" rx="1" fill="${c.bg}"/>
   <path d="M20 46a12 12 0 0 1 24 0Z" fill="${c.ac}"/>${raios(c,32,46,15,19,5).replace(/y1="(\d+\.?\d*)"/g,'y1="$1"')}`,
 shin:c=>`<circle cx="32" cy="12" r="5" fill="${c.ac}"/>
   <g fill="none" stroke="${c.fg}" stroke-width="6.5" stroke-linecap="round">
   <path d="M14 24C14 46 22 54 32 54S50 46 50 24"/><path d="M32 24v30"/></g>`
};
const sym=(k,c,px)=>`<svg viewBox="0 0 64 64" width="${px}" height="${px}" style="flex:none">${SIMBOLOS[k](c)}</svg>`;

const CONCEITOS=[
 {k:'cena',nome:'O sítio dentro do arco',ideia:'Uma pequena ilustração da paisagem: o sol nascendo atrás da serra, colinas em três tons de verde e uma árvore. Mantém o arco da primeira versão, mas conta a história do lugar em vez de um desenho abstrato. É a mais rica em detalhe; funciona do tamanho de um cartão de visita para cima.'},
 {k:'pomba',nome:'Pomba com ramo de oliveira',ideia:'Shalom é paz, e o símbolo universal da paz é a pomba com o ramo. Em círculo verde, com o ramo em âmbar. Emocional e imediata, entendida por qualquer pessoa. Pede cuidado no desenho final, que um ilustrador deve refinar.'},
 {k:'folhas',nome:'Cruz de folhas',ideia:'Quatro folhas de oliveira formam uma cruz, com o sol no centro. Lembra também uma bússola ou uma flor, ou seja, caminho e natureza. Geométrico, fácil de bordar, estampar e gravar em madeira.'},
 {k:'trilha',nome:'A trilha em S',ideia:'A letra S desenhada como uma trilha que sobe até o sol, num quadrado de cantos arredondados. Tem cara de aplicativo e de sinalização de trilha ecológica. Moderna e fácil de reconhecer pequena.'},
 {k:'brasao',nome:'Brasão',ideia:'Um escudo com cruz e sol nascente, com moldura interna fina. Passa herança, firmeza e tradição, bom para uma marca de retiros que as igrejas devem confiar. Mais formal que as outras.'},
 {k:'shin',nome:'Shin (a letra de Shalom)',ideia:'Em hebraico, Shalom começa com a letra Shin (ש), que tem três hastes. Aqui ela vira o símbolo, com o sol acima: as três hastes também lembram os 3 dias do pacote. Quem conhece a letra entende de cara; para os demais é um desenho limpo e original.'}
];

const lista=document.getElementById('lista');
CONCEITOS.forEach((c,i)=>{
  const bloco=(t,tema)=>`<div class="lock ${tema}">${sym(c.k,t,72)}<div><span class="n">Sítio Shalom</span><span class="s">Xerém · Retiros &amp; Eventos</span></div></div>`;
  lista.insertAdjacentHTML('beforeend',`<section class="conceito"><div class="topo"><b>Ideia ${i+7}</b><h2>${c.nome}</h2></div><p>${c.ideia}</p>
   <div class="linha"><div class="palco l">${bloco(L,'l')}</div><div class="palco d">${bloco(D,'d')}</div>
   <div class="palco i"><div class="app">${sym(c.k,D,40)}</div><div class="peq">${sym(c.k,L,40)}${sym(c.k,L,16)}</div></div></div></section>`);
});
</script>
</body>
</html>
